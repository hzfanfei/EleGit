name: wenxiang
description: 问象 — ask a local Cursor-backed server about GitHub repo progress.
publish_to: "none"
version: 0.1.0+9

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  permission_handler: ^11.4.0
  record: ^6.1.2
  web_socket_channel: ^3.0.3
  audioplayers: ^6.5.1
  path_provider: ^2.1.5
  flutter_markdown: ^0.7.7+1
  package_info_plus: ^8.0.0
  flutter_local_notifications: ^18.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: WenxiangSerif
      fonts:
        - asset: fonts/NotoSerifSC-SemiBold.ttf
          weight: 600
